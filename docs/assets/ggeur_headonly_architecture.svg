<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <style>
      .title { font: 700 30px "Microsoft YaHei", Arial, sans-serif; fill: #1b1f24; }
      .subtitle { font: 500 17px "Microsoft YaHei", Arial, sans-serif; fill: #57606a; }
      .box-title { font: 700 20px "Microsoft YaHei", Arial, sans-serif; fill: #1b1f24; }
      .box-text { font: 15px "Microsoft YaHei", Arial, sans-serif; fill: #3b434b; }
      .small { font: 13px "Microsoft YaHei", Arial, sans-serif; fill: #57606a; }
      .label { font: 700 15px "Microsoft YaHei", Arial, sans-serif; fill: #1b1f24; }
      .pill { font: 14px "Microsoft YaHei", Arial, sans-serif; fill: #1b1f24; }
      .phase { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #064e3b; }
      .client { fill: #eef6ff; stroke: #3578c6; stroke-width: 2; }
      .subserver { fill: #fff7e6; stroke: #d18616; stroke-width: 2; }
      .root { fill: #f0f7ef; stroke: #2f8f46; stroke-width: 2; }
      .param { fill: #f5f0ff; stroke: #7b61c9; stroke-width: 2; }
      .stage { fill: #ecfdf5; stroke: #2f8f46; stroke-width: 1.5; }
      .note { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .arrow { stroke: #24292f; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-blue { stroke: #3578c6; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-orange { stroke: #d18616; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-orange); }
      .arrow-purple { stroke: #7b61c9; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead-purple); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#24292f"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#3578c6"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#d18616"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#7b61c9"/>
    </marker>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="60" y="58" class="title">GGEUR Head-only 高 QPS 分层联邦训练方案</text>
  <text x="60" y="88" class="subtitle">可行性论证版：先分析方案结构、训练流程和理论可行性，不等同于立即实施计划</text>

  <rect x="60" y="124" width="1380" height="92" rx="10" class="stage"/>
  <text x="88" y="158" class="phase">核心拆分</text>
  <text x="88" y="188" class="box-text">第 0 轮：client 加载预训练模型，提取本地 feature，完成 GGEUR 统计与增强；随后释放 backbone。</text>
  <text x="760" y="188" class="box-text">第 1 轮以后：client 只保留增强 feature cache 与 MLP head，通信和聚合只围绕 MLP 参数。</text>

  <rect x="90" y="282" width="280" height="400" rx="12" class="client"/>
  <text x="120" y="320" class="box-title">Client Group A</text>
  <text x="120" y="352" class="box-text">多个客户端</text>
  <text x="120" y="382" class="box-text">本地持有：</text>
  <text x="140" y="410" class="small">• 原始数据，仅第 0 轮使用</text>
  <text x="140" y="438" class="small">• 增强 feature cache</text>
  <text x="140" y="466" class="small">• MLP head / optimizer state</text>
  <text x="120" y="506" class="box-text">不再长期持有：</text>
  <text x="140" y="534" class="small">• ViT / ConvNeXt / Mixer 参数</text>
  <text x="140" y="562" class="small">• backbone 梯度与优化器</text>
  <rect x="122" y="604" width="216" height="42" rx="21" fill="#dbeafe" stroke="#3578c6"/>
  <text x="151" y="631" class="pill">只上传 MLP update</text>

  <rect x="90" y="718" width="280" height="130" rx="12" class="client"/>
  <text x="120" y="754" class="box-title">Client Group B / C / ...</text>
  <text x="120" y="786" class="box-text">每组由一个 sub-server 管理</text>
  <text x="120" y="814" class="small">规模扩展方向：几千到一万 client</text>

  <rect x="500" y="300" width="280" height="170" rx="12" class="subserver"/>
  <text x="532" y="338" class="box-title">Sub-server A</text>
  <text x="532" y="372" class="box-text">管理一组 client</text>
  <text x="532" y="402" class="box-text">接收 MLP update</text>
  <text x="532" y="432" class="box-text">局部加权聚合</text>
  <text x="532" y="462" class="small">达到 quorum 或 timeout 后上报</text>

  <rect x="500" y="640" width="280" height="170" rx="12" class="subserver"/>
  <text x="532" y="678" class="box-title">Sub-server B</text>
  <text x="532" y="712" class="box-text">同构水平扩展</text>
  <text x="532" y="742" class="box-text">分担 upload QPS</text>
  <text x="532" y="772" class="small">root server 不直接接收所有 client</text>

  <rect x="920" y="430" width="270" height="190" rx="12" class="root"/>
  <text x="958" y="468" class="box-title">Root Server</text>
  <text x="958" y="502" class="box-text">接收各 sub-server 聚合结果</text>
  <text x="958" y="532" class="box-text">全局加权聚合</text>
  <text x="958" y="562" class="box-text">FedOpt 等 server-side update</text>
  <text x="958" y="592" class="small">输出新版本 global MLP</text>

  <rect x="1220" y="255" width="230" height="210" rx="12" class="param"/>
  <text x="1250" y="294" class="box-title">Parameter Service</text>
  <text x="1250" y="328" class="box-text">保存 global_mlp@vN</text>
  <text x="1250" y="358" class="box-text">latest version 查询</text>
  <text x="1250" y="388" class="box-text">高并发参数下载</text>
  <text x="1250" y="418" class="small">不做训练计算，不做聚合</text>

  <path d="M 370 390 C 430 390, 440 385, 500 385" class="arrow-orange"/>
  <text x="390" y="365" class="label">MLP update</text>
  <text x="388" y="586" class="label">MLP update</text>
  <path d="M 370 770 C 430 770, 440 725, 500 725" class="arrow-orange"/>

  <path d="M 780 385 C 835 385, 858 485, 920 500" class="arrow"/>
  <path d="M 780 725 C 842 725, 858 572, 920 550" class="arrow"/>
  <text x="805" y="450" class="label">局部聚合结果</text>
  <text x="805" y="662" class="label">局部聚合结果</text>

  <path d="M 1190 490 C 1248 470, 1288 468, 1318 465" class="arrow-purple"/>
  <text x="1195" y="450" class="label">发布 global_mlp@vN+1</text>

  <path d="M 1220 345 C 1020 210, 650 210, 230 282" class="arrow-blue dashed"/>
  <text x="660" y="246" class="label">client 拉取 global_mlp@vN</text>

  <rect x="930" y="710" width="500" height="160" rx="12" class="note"/>
  <text x="960" y="748" class="box-title">QPS 统计口径</text>
  <text x="960" y="782" class="box-text">download QPS：Parameter Service → Clients，全局 MLP 参数读取请求</text>
  <text x="960" y="812" class="box-text">upload QPS：Clients → Sub-servers，本地 MLP update 上传请求</text>
  <text x="960" y="842" class="box-text">训练吞吐还要同时看 round time、聚合耗时、late update 比例</text>

  <rect x="410" y="865" width="680" height="56" rx="28" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="446" y="900" class="subtitle">高 QPS 的关键不是让完整大模型通信更快，而是把稳定训练阶段变成轻量 MLP 参数通信。</text>
</svg>
