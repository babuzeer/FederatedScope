# OfficeHome ViT-B/16 HeadOnly cache generation on the 4090 server.
# The runner script can override client count, rounds, paths and cache version.

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 120
  total_round_num: 20
  sample_client_num: 120
  make_global_eval: False

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.0001

eval:
  freq: 1
  metrics: ['acc']
  split: ['test']
  best_res_update_round_wise_key: 'test_acc'

trainer:
  type: 'ggeur'

ggeur:
  use: True
  head_only_mode: True
  head_only_after_round0: True
  headonly_cache_version: 'officehome_vitb16_120c_gen20_fcache_v1'
  headonly_eval_mode: 'server'

  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  clip_model_path: '/root/autodl-tmp/models/open_clip_vitb16.bin'
  embedding_dim: 512
  freeze_backbone: True
  use_feature_cache: True
  unload_extractor_after_cache: True
  use_fp16_extraction: True
  extract_batch_size: 64
  feature_cache_dir: 'exp/ggeur_headonly_real_cache/officehome_vitb16_120c_gen20_fcache_v1'

  num_generated_per_sample: 20
  num_generated_per_prototype: 20
  target_size_per_class: 20

  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  use_cross_client_prototypes: True
  statistics_round: 0
  distributed_stage_timeout: 3600

  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  use_end_to_end_finetune: False
  use_promptfl: False

  headonly_skip_round0_if_augmented_cache_exists: False

outdir: 'exp/headonly_cache_generation'
expname: 'officehome_vit_cachegen_120c_20r_gen20'
