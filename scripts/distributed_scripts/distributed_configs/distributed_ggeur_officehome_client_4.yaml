use_gpu: True
device: 0
early_stop:
  patience: 10
seed: 42

federate:
  method: 'ggeur'
  client_num: 4
  mode: 'distributed'
  make_global_eval: False
  online_aggr: False
  total_round_num: 100  # Increased from 50 to match standalone

distribute:
  use: True
  server_host: '127.0.0.1'
  server_port: 50051
  client_host: '127.0.0.1'
  client_port: 50055
  role: 'client'
  data_idx: 2
  client_id: 4
  heartbeat_timeout: 600  # 10 minutes for feature extraction

distributed_data:
  enabled: True
  dataset: office-home
  shard_path: data/officehome/shards/client_4
  manifest: data/officehome/shards/manifest.json
  strict_check: False
  meta_file: meta.json

data:
  root: /root/OfficeHomeDataset_10072016
  type: ggeur
  splits: [0.7, 0.0, 0.3]
  transform: [['Resize', {'size': [224, 224]}], ['ToTensor'],
              ['Normalize', {'mean': [0.485, 0.456, 0.406],
                             'std': [0.229, 0.224, 0.225]}]]

dataloader:
  batch_size: 16  # Reduced from 32 to match standalone
  num_workers: 4

model:
  type: ggeur_clip
  out_channels: 65

train:
  local_update_steps: 10  # Changed from 5 to 10 epochs to match standalone
  batch_or_epoch: epoch
  optimizer:
    type: Adam  # Changed from SGD to Adam
    lr: 0.001   # Changed from 0.01 to 0.001


criterion:
  type: CrossEntropyLoss

trainer:
  type: ggeur_trainer

eval:
  freq: 5
  metrics: ['acc', 'correct']
  report: ['weighted_avg', 'raw']
  count_flops: False

ggeur:
  use_feature_cache: True
  feature_cache_dir: ''
  clip_model: ViT-B/16
  clip_pretrained: openai
  clip_model_path: /root/open_clip_vitb16.bin
  feature_extractor: clip
  embedding_dim: 512
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  num_generated_per_sample: 50
  num_generated_per_prototype: 50
  target_size_per_class: 50
  use_cross_client_prototypes: True
  statistics_round: 0
  use_lds: False
