use_gpu: True
device: 0
early_stop:
  patience: 10
seed: 42

federate:
  method: 'ggeur'
  client_num: 4
  mode: 'distributed'
  make_global_eval: False
  online_aggr: False
  total_round_num: 50

distribute:
  use: True
  server_host: '127.0.0.1'
  server_port: 50051
  client_host: '127.0.0.1'
  client_port: 50052
  role: 'client'
  data_idx: 2
  client_id: 1

distributed_data:
  enabled: True
  dataset: office-home
  shard_path: data/officehome/shards/client_1
  manifest: data/officehome/shards/manifest.json
  strict_check: False
  meta_file: meta.json

data:
  root: /root/OfficeHomeDataset_10072016
  type: ggeur
  splits: [0.7, 0.0, 0.3]
  transform: [['Resize', {'size': [224, 224]}], ['ToTensor'],
              ['Normalize', {'mean': [0.485, 0.456, 0.406],
                             'std': [0.229, 0.224, 0.225]}]]

dataloader:
  batch_size: 32
  num_workers: 4

model:
  type: ggeur_clip
  out_channels: 65

train:
  local_update_steps: 5
  batch_or_epoch: epoch
  optimizer:
    type: SGD
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005

grad:
  grad_clip: 5.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: ggeur_trainer

eval:
  freq: 5
  metrics: ['acc', 'correct']
  report: ['weighted_avg', 'raw']
  count_flops: False

ggeur:
  use_feature_cache: True
  feature_cache_dir: ''
  clip_model: ViT-B/16
  clip_pretrained: openai
  clip_model_path: /root/open_clip_vitb16.bin
  feature_extractor: clip
  use_lds: False
