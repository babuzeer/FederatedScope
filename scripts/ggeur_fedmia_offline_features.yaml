use_gpu: True
device: 0
seed: 12345

federate:
  mode: standalone
  total_round_num: 300
  client_num: 10
  sample_client_num: 10
  make_global_eval: True

data:
  type: 'cifar100_features'
  root: 'data/cifar100_features/'

dataloader:
  batch_size: 256
  num_workers: 0
  shuffle: True

model:
  type: mlp_head
  feature_dim: 1024
  num_classes: 100
  hidden_dim: 256
  dropout: 0.1

train:
  local_update_steps: 1
  batch_or_epoch: epoch
  optimizer:
    lr: 0.01
    weight_decay: 0.0

criterion:
  type: CrossEntropyLoss

trainer:
  type: general

eval:
  freq: 5
  metrics: ['acc', 'correct']
  best_res_update_round_wise_key: 'test_loss'

attack:
  attack_method: ggeur_fedmia
  fedmia_target_client_id: 1
  fedmia_variant: FedMIA-I

  # GGEUR heterogeneity handling
  use_ggeur: True
  ggeur_num_per_sample: 50
  ggeur_target_size: 50
  ggeur_use_cross_client: True

  # Modular attack framework
  modular_attacks: True
  attack_plugins:
    - loss_series
    - avg_cosine
    - fedmia_i
    - fedmia_ii
