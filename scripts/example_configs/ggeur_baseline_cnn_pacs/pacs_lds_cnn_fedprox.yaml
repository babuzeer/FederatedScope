# Baseline (CNN): ConvNeXt-Base (pretrained, frozen) + MLP + FedProx (No GGEUR data generation)
#
# Purpose: Run FedProx as a baseline comparison against GGEUR (CNN branch).
# Dataset: PACS (4 domains: photo, art_painting, cartoon, sketch; 7 classes)

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 28
  total_round_num: 100
  sample_client_num: 0

fedprox:
  use: True
  mu: 0.1

data:
  type: 'pacs'
  root: '/root/autodl-tmp/datasets/PACS'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 7

train:
  local_update_steps: 8
  optimizer:
    type: 'Adam'
    lr: 0.0002

ggeur:
  use: True

  # Feature extractor (CNN)
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''

  # Disable GGEUR augmentation (baseline)
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # MLP
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off
  use_fedproto: False

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'pacs_lds/cnn/fedprox'
