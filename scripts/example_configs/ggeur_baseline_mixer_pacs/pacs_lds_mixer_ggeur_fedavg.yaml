# GGEUR (MLP-Mixer): MLP-Mixer-B/16 (local pretrained weights) + MLP + FedAvg
#
# Purpose: Run GGEUR with MLP-Mixer under FedAvg aggregation.
# Dataset: PACS (4 domains: photo, art_painting, cartoon, sketch; 7 classes)
#
# Prerequisites:
# 1. Download pretrained weights using download_mixer_weights_complete.py
# 2. Place mixer_b16_224_complete.pth in pretrained_weights/ directory
#
# Run:
#   python federatedscope/main.py --cfg scripts/example_configs/ggeur_baseline_mixer_pacs/pacs_lds_mixer_ggeur_fedavg.yaml

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 28
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'pacs'
  root: '/root/data/PACS'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 7

train:
  local_update_steps: 10
  optimizer:
    type: 'Adam'
    lr: 0.001

ggeur:
  use: True

  # Feature extractor (MLP-Mixer with local weights)
  feature_extractor: 'timm'
  timm_model: 'mixer_b16_224'
  timm_pretrained: False  # Set to False when using local checkpoint
  timm_checkpoint_path: 'pretrained_weights/mixer_b16_224_complete.pth'
  timm_in_chans: 3
  timm_global_pool: 'avg'
  freeze_backbone: True
  embedding_dim: 768

  # Feature caching
  use_feature_cache: True
  feature_cache_dir: ''

  # Enable GGEUR augmentation
  num_generated_per_sample: 100
  num_generated_per_prototype: 100
  target_size_per_class: 100

  # MLP classifier
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain settings
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off
  use_fedproto: False

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'pacs_lds/mixer/ggeur/fedavg'
