# Config 3: GGEUR + CLIP (ViT-B-16) + MLP + FedProto
#
# GGEUR feature augmentation with FedProto regularization
# - Feature extractor: CLIP ViT-B-16 (pretrained, frozen)
# - Classifier: MLP
# - Aggregation: FedAvg + FedProto prototype regularization
# - Data augmentation: GGEUR Gaussian feature generation

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: 'OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 10
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  embedding_dim: 512

  # GGEUR augmentation
  num_generated_per_sample: 50
  num_generated_per_prototype: 50
  target_size_per_class: 0

  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto enabled
  use_fedproto: True
  proto_weight: 1.0
  proto_distance: 'cosine'
  proto_temperature: 0.1

  # LDS settings
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/vit_comparison/ggeur_clip_fedproto'
expname: 'ggeur_clip_fedproto'
