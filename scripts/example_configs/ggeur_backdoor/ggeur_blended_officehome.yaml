# GGEUR + FS backdoor attack (Blended / hkTrigger) on Office-Home
# Requires: trigger/hello_kitty.png
use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 12

data:
  type: 'office-home'
  root: 'data/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 16
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.001

ggeur:
  use: True
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  embedding_dim: 512
  use_feature_cache: True
  feature_cache_dir: ''
  num_generated_per_sample: 50
  num_generated_per_prototype: 50
  target_size_per_class: 50
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

attack:
  attack_method: 'backdoor'
  attacker_id: [1, 16, 31, 46]
  setting: 'all'
  freq: 10
  label_type: 'dirty'
  trigger_type: 'hkTrigger'
  poison_ratio: 0.2
  target_label_ind: 0
  trigger_path: 'trigger'
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

outdir: 'exp/ggeur_backdoor_officehome_blended'
expname: 'ggeur_officehome_blended'
