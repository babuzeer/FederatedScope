# Baseline (CNN): ConvNeXt-Base (pretrained, frozen) + MLP + FedProto (No GGEUR data generation)
#
# Purpose: Run FedProto as a baseline comparison against GGEUR (CNN branch).
# Implementation note: This uses FederatedScope's GGEUR pipeline for feature
# extraction + MLP training, but disables Gaussian feature generation.

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 3
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True

  # Feature extractor (CNN)
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''

  # Disable GGEUR augmentation (baseline)
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # MLP
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto regularization (on embeddings)
  use_fedproto: True
  # Reduce strength to avoid over-dominating other baselines
  proto_weight: 0.5
  proto_distance: 'cosine'
  proto_temperature: 0.1

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'officehome_lds/cnn/fedproto'
