use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'domainnet'
  root: '/root/autodl-tmp/datasets/DomainNet'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 345

train:
  local_update_steps: 5
  optimizer:
    type: 'Adam'
    lr: 0.001

ggeur:
  use: True
  
  domainnet_shared_classes_only: False
  feature_extractor: 'timm'
  timm_model: 'mixer_b16_224'
  timm_pretrained: False
  timm_checkpoint_path: '/root/autodl-tmp/models/mixer_b16_224_complete.pth'
  timm_in_chans: 3
  timm_global_pool: 'avg'
  freeze_backbone: True
  embedding_dim: 768
  use_feature_cache: True
  feature_cache_dir: ''
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0
  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0
  use_fedproto: True
  proto_weight: 0.5
  proto_distance: 'cosine'
  proto_temperature: 0.1
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/domainnet_4domains/mlp/fedproto'
expname: 'domainnet_4domains_mlp_fedproto'

