# Config 2: GGEUR + ConvNeXt + MLP + FedProx
#
# GGEUR feature augmentation with FedProx aggregation
# - Feature extractor: ConvNeXt-Base (pretrained, frozen)
# - Classifier: MLP
# - Aggregation: FedProx (with proximal term)
# - Data augmentation: GGEUR Gaussian feature generation

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

# FedProx settings
fedprox:
  use: True
  mu: 0.01

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 10
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True
  feature_extractor: 'cnn'
  cnn_backbone: 'convnext_base'
  cnn_pretrained: True
  freeze_backbone: True
  embedding_dim: 1024
  use_feature_cache: False
  feature_cache_dir: ''

  # GGEUR augmentation
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto disabled
  use_fedproto: False

  # LDS settings
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/cnn_comparison/ggeur_convnext_fedprox'
expname: 'ggeur_convnext_fedprox'
