# GGEUR + PromptFL (CLIP Text Soft Prompts) - PACS
#
# Combines GGEUR Gaussian feature augmentation with PromptFL:
# 1. GGEUR extracts CLIP features and augments them via global covariance
# 2. PromptFL trains soft text prompts (ctx vectors) on the augmented features
# 3. Only ctx vectors are federated (16x512 = 8192 params vs MLP's 3584)
#
# Dataset: PACS (4 domains: photo, art_painting, cartoon, sketch; 7 classes)
# Requires: feature_extractor='clip' (text prompts need CLIP text encoder)
# Reference: PromptFL (Guo et al., 2022) + GGEUR

# ========== Basic Settings ==========
use_gpu: True
device: 1
seed: 42
verbose: 1

# ========== Federated Learning Settings ==========
federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 4
  total_round_num: 20

# ========== Data Settings ==========
data:
  type: 'pacs'
  root: '/root/data/PACS'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 64
  num_workers: 0

# ========== Model Settings ==========
model:
  type: 'ggeur_mlp'
  num_classes: 7

# ========== Training Settings ==========
train:
  local_update_steps: 2
  optimizer:
    type: 'Adam'
    lr: 0.001

# ========== GGEUR + PromptFL Settings ==========
ggeur:
  use: True

  # ===== Feature Extractor: must be 'clip' for PromptFL =====
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  clip_model_path: '/root/model/open_clip_vitb16.bin'
  embedding_dim: 512

  # ===== Feature Caching =====
  use_feature_cache: True
  feature_cache_dir: ''

  # ===== Feature Augmentation =====
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 20

  # ===== MLP Classifier =====
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # ===== Multi-domain Settings =====
  use_cross_client_prototypes: False
  statistics_round: 0

  # ===== LDS Settings =====
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # ===== Disable CNN modes =====
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

  # ===== PromptFL Settings =====
  use_promptfl: True
  prompt_length: 16
  prompt_lr: 0.002
  prompt_local_epochs: 1
  prompt_temperature: 0.07
  prompt_class_names: []
  prompt_template: 'a photo of a {}'
  hf_clip_model_id: 'openai/clip-vit-base-patch16'

# ========== Output Settings ==========
outdir: 'exp/ggeur_promptfl_clip'
expname: 'ggeur_promptfl_pacs'
