seed: 42
use_gpu: True
device: 0
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 4
  total_round_num: 3
  sample_client_num: 4
  make_global_eval: False

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 2

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.0001

eval:
  freq: 0
  metrics: ['acc']
  split: ['test']
  best_res_update_round_wise_key: 'test_acc'

trainer:
  type: 'ggeur'

ggeur:
  use: True
  head_only_mode: True
  feature_extractor: 'clip'
  clip_model: 'ViT-B-16'
  clip_pretrained: 'openai'
  clip_model_path: '/root/autodl-tmp/models/open_clip_vitb16.bin'
  embedding_dim: 512
  freeze_backbone: True
  use_feature_cache: True
  unload_extractor_after_cache: True
  use_fp16_extraction: True
  extract_batch_size: 64

  num_generated_per_sample: 2
  num_generated_per_prototype: 2
  target_size_per_class: 2

  mlp_hidden_dim: 0
  mlp_dropout: 0.0
  use_cross_client_prototypes: True
  statistics_round: 0

  use_fedproto: False
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False
  use_end_to_end_finetune: False
  use_promptfl: False

ggeur_headonly:
  use: True
  client_total: 4
  sample_clients_per_round: 4
  num_sub_servers: 2
  min_received_ratio: 1.0
  round_timeout: 0.0
  late_update_policy: 'discard'
  process_workers: 4

  run_data_generation: True
  overwrite_feature_cache: False
  reuse_feature_cache: True
  feature_cache_dir: 'exp/ggeur_headonly_real_cache/officehome_vitb16_fcache_v1'
  feature_cache_version: 'officehome_vitb16_fcache_v1'
  augmentation_noise_scale: 1.0
  covariance_epsilon: 0.0001

  param_dtype: 'float32'
  run_root: 'exp/ggeur_headonly_real_cache/runs'
  run_id: ''
  output_json: ''
