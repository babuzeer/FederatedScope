# GGEUR + Bad-PFL on Multi-Domain Sentiment (RNN)

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 120
  total_round_num: 12
  sample_client_num: 20

data:
  type: 'mdsent'
  root: 'data/sentiment'
  splits: [0.8, 0, 0.2]
  dirichlet_alpha: 0.01
  args:
    - include_unlabeled: True
      balance_test: True
      seed: 42
      use_cache: True

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_rnn'
  num_classes: 4
  in_channels: 768
  hidden: 256
  layer: 1
  dropout: 0.1

train:
  local_update_steps: 5
  optimizer:
    type: 'Adam'
    lr: 1e-3

ggeur:
  use: True
  feature_extractor: 'bert'
  bert_model_path: 'pretrained_models/nlptown_bert_base_multilingual_uncased_senti'
  bert_tokenizer_path: ''
  bert_max_length: 128
  bert_pooling: 'cls'
  bert_batch_size: 32
  bert_local_files_only: True
  bert_use_pretrained_weights: True
  embedding_dim: 768
  use_feature_cache: True
  feature_cache_dir: ''
  num_generated_per_sample: 200
  num_generated_per_prototype: 200
  target_size_per_class: 200
  use_cross_client_prototypes: True
  statistics_round: 0
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

attack:
  attack_method: 'bad_pfl'
  attacker_id: [1, 2, 3, 4]
  target_label_ind: 3
  poison_ratio: 0.5
  label_type: 'dirty'
  bad_pfl:
    start_round: 1
    generator_hidden_dim: 768
    generator_lr: 2e-3
    generator_steps: 6
    generator_tune_batches: 48
    trigger_scale: 0.45
    trigger_max_norm: 2.0
    disruptive_eps: 0.35
    disruptive_alpha: 0.12
    disruptive_steps: 3
    lambda_trigger_reg: 1e-4
    clean_weight: 1.0
    poison_weight: 4.0
    append_poisoned: True
    poison_repeats: 2
    target_feature_blend: 0.35
    target_align_weight: 0.5
    margin_weight: 0.5
    use_shared_target_reference: True
    force_attacker_participation: True
    eval_poison: True

outdir: 'exp/ggeur_rnn_sentiment_smoke'
expname: 'ggeur_mdsent_rating4_rnn_bad_pfl_strong_smoke'
