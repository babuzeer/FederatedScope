# Baseline (MLP-Mixer): MLP-Mixer-B/16 + MLP + FedAvg (No GGEUR data generation)
#
# Purpose: Run FedAvg baseline without GGEUR augmentation for comparison.
# This uses the same settings as the GGEUR experiment but disables data generation.
#
# Prerequisites:
# 1. Pretrained weights at: pretrained_weights/mixer_b16_224_complete.pth
#
# Run:
#   python federatedscope/main.py --cfg scripts/example_configs/ggeur_baseline_mixer/officehome_lds_mixer_fedavg_baseline_local_weights.yaml

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: 'OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 10
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True

  # Feature extractor (MLP-Mixer with local weights)
  feature_extractor: 'timm'
  timm_model: 'mixer_b16_224'
  timm_pretrained: False  # Using local checkpoint
  timm_checkpoint_path: 'pretrained_weights/mixer_b16_224_complete.pth'
  timm_in_chans: 3
  timm_global_pool: 'avg'
  freeze_backbone: True  # Freeze pretrained backbone
  embedding_dim: 768

  # Feature caching
  use_feature_cache: True
  feature_cache_dir: ''

  # *** Disable GGEUR augmentation (baseline) ***
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # MLP classifier (same as GGEUR)
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain settings
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off (pure FedAvg)
  use_fedproto: False

  # LDS split (same as GGEUR)
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'officehome_lds/mixer/fedavg_baseline'
