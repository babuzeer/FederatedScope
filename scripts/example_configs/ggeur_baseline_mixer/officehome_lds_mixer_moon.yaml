# Baseline (MLP-Mixer): MLP-Mixer-B/16 (local pretrained weights) + MLP + MOON (No GGEUR data generation)
#
# Purpose: Run MOON as a baseline comparison against GGEUR (Mixer branch).
# Ref: Li et al., "Model-Contrastive Federated Learning", CVPR 2021
# Implementation note: This uses FederatedScope's GGEUR pipeline for feature
# extraction + MLP training, but disables Gaussian feature generation.
# MOON adds a contrastive loss that pulls the local model toward the global model
# and pushes it away from the previous local model.
#
# Prerequisites:
#   pretrained_weights/mixer_b16_224_complete.pth

use_gpu: True
device: 0
seed: 42
verbose: 1

federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 60
  total_round_num: 100
  sample_client_num: 0

data:
  type: 'office-home'
  root: '/root/autodl-tmp/datasets/OfficeHomeDataset_10072016'
  splits: [0.7, 0.0, 0.3]

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: 'ggeur_mlp'
  num_classes: 65

train:
  local_update_steps: 5
  optimizer:
    type: 'Adam'
    lr: 0.0001

ggeur:
  use: True

  # Feature extractor (MLP-Mixer with local weights)
  feature_extractor: 'timm'
  timm_model: 'mixer_b16_224'
  timm_pretrained: False
  timm_checkpoint_path: 'pretrained_weights/mixer_b16_224_complete.pth'
  timm_in_chans: 3
  timm_global_pool: 'avg'
  freeze_backbone: True
  embedding_dim: 768

  use_feature_cache: True
  feature_cache_dir: ''

  # Disable GGEUR augmentation (baseline)
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0

  # MLP
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  # Multi-domain
  use_cross_client_prototypes: True
  statistics_round: 0

  # FedProto off
  use_fedproto: False

  # MOON contrastive regularization
  use_moon: True
  moon_mu: 5.0
  moon_temperature: 0.5

  # LDS split
  use_lds: True
  lds_alpha: 0.1
  lds_seed: 42

  # Keep other modes off
  use_cnn_distillation: False
  use_feature_alignment: False
  use_separated_training: False

outdir: 'exp/ggeur_baselines'
expname: 'officehome_lds/mixer/moon'
