# FedAvg baseline on CPSD using the same GGEUR infrastructure (NO augmentation)
#
# This matches the existing FS baseline style for GGEUR experiments:
# - Use `federate.method: ggeur` to reuse the statistics/feature pipeline
# - Disable augmentation so training uses only the original imbalanced data

# ========== Basic Settings ==========
use_gpu: True
device: 0
seed: 42
verbose: 1

# ========== Federated Learning Settings ==========
federate:
  method: 'ggeur'
  mode: 'standalone'
  client_num: 30
  total_round_num: 50
  sample_client_num: 30

# ========== Data Settings ==========
data:
  type: 'cpsd'
  root: 'data/CPSD'
  splits: [0.9, 0.1, 0.0]
  dirichlet_alpha: 0.1
  args:
    - max_train_samples_per_domain: 20000
      max_test_samples_per_domain: 5000
      seed: 42
      use_cache: True

dataloader:
  batch_size: 32
  num_workers: 0

# ========== Model Settings ==========
model:
  type: 'ggeur_rnn'
  num_classes: 2
  in_channels: 768
  hidden: 256
  layer: 1
  dropout: 0.1

# ========== Training Settings ==========
train:
  local_update_steps: 1
  optimizer:
    type: 'Adam'
    lr: 0.001

# ========== GGEUR Settings (No Augmentation) ==========
ggeur:
  use: True
  feature_extractor: 'bert'

  bert_model_path: 'pretrained_models/nlptown_bert_base_multilingual_uncased_senti'
  bert_tokenizer_path: ''
  bert_max_length: 128
  bert_pooling: 'cls'
  bert_batch_size: 32
  bert_local_files_only: True
  # If False, do NOT use pretrained BERT weights for feature extraction
  bert_use_pretrained_weights: False

  embedding_dim: 768
  use_feature_cache: True
  feature_cache_dir: ''

  # === KEY DIFFERENCE: No augmentation ===
  num_generated_per_sample: 0
  num_generated_per_prototype: 0
  target_size_per_class: 0
  use_cross_client_prototypes: True

  # (Unused in RNN/LSTM mode; kept for compatibility)
  mlp_hidden_dim: 0
  mlp_dropout: 0.0

  statistics_round: 0

# ========== Output Settings ==========
outdir: 'exp/fedavg_rnn_sentiment'
expname: 'fedavg_cpsd_lstm_no_augmentation'
